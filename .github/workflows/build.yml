name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:/vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules (shallow)
        run: git submodule update --init --recursive --depth 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows-msvc
          variant: sccache

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: cmake --preset default -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Engine
        run: cmake --build build --config RelWithDebInfo --target Engine

      - name: Build Editor
        run: cmake --build build --config RelWithDebInfo --target Editor

  build-windows-vulkan:
    name: Windows Vulkan (MSVC)
    runs-on: windows-2022

    env:
      VCPKG_ROOT: C:/vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules (shallow)
        run: git submodule update --init --recursive --depth 1

      - name: Install Vulkan SDK
        run: |
          $sdkVersion = "1.4.341.1"
          $url = "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/VulkanSDK-$sdkVersion-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP/vulkan-sdk.exe" -ArgumentList "/S" -Wait
          echo "VULKAN_SDK=C:/VulkanSDK/$sdkVersion" >> $env:GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: windows-msvc-vulkan
          variant: sccache

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: cmake --preset vs2022-vulkan -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Engine
        run: cmake --build build --config RelWithDebInfo --target Engine

      - name: Build Editor
        run: cmake --build build --config RelWithDebInfo --target Editor

  build-linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            sanitize: false
            ccache-key: linux-gcc
            vcpkg-cache-key: vcpkg-linux
            cmake-preset: linux-default
            extra-cmake-flags: ''
          - name: GCC + ASAN/UBSAN
            sanitize: true
            ccache-key: linux-gcc-sanitize
            vcpkg-cache-key: vcpkg-linux-sanitize
            cmake-preset: linux-sanitize
            extra-cmake-flags: ''

    env:
      VCPKG_ROOT: /usr/local/share/vcpkg

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize submodules (shallow)
        run: git submodule update --init --recursive --depth 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.ccache-key }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libgl-dev libglu1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            nasm autoconf automake libtool pkg-config

      - name: Bootstrap vcpkg
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics || true
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: ${{ matrix.vcpkg-cache-key }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: cmake --preset ${{ matrix.cmake-preset }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.extra-cmake-flags }}

      - name: Build Engine
        run: cmake --build build --target Engine

      - name: Build Editor
        run: cmake --build build --target Editor

      - name: Build EngineTests
        if: matrix.sanitize
        run: cmake --build build --target EngineTests

      - name: Run CTest
        if: matrix.sanitize
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary dependencies (ldd)
        run: |
          echo "=== ldd Editor ==="
          ldd build/Editor/Editor
          if ldd build/Editor/Editor | grep -q "not found"; then
            echo "::error::Missing shared libraries detected!"
            ldd build/Editor/Editor | grep "not found"
            exit 1
          fi
          echo "All shared library dependencies resolved."
